name: leitor_ebooks
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_quill: ^11.2.0
  provider: ^6.1.1
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2
  font_awesome_flutter: ^10.6.0
  http: ^1.1.0
  vocsy_epub_viewer: ^2.0.0
  device_info_plus: ^9.1.1
  dio: ^5.4.0
  permission_handler: ^11.0.1
  path_provider: ^2.1.1
  mobx: ^2.2.3
  flutter_mobx: ^2.2.0+1
  loading_animation_widget: ^1.2.0+4
  cached_network_image: ^3.3.0
  flutter_native_splash: ^2.3.7
  flutter_launcher_icons: ^0.13.1
  http_parser: ^4.1.2
  mime: ^2.0.0
  firebase_auth: ^5.5.2
  firebase_core: ^3.13.0
  google_sign_in: ^6.3.0
  google_sign_in_web: ^0.12.4+4
  flutter_masked_text2: ^0.9.1
  mask: ^1.0.5
  image_picker: ^1.1.2
  rive: ^0.11.17
  flutter_quill_extensions: ^11.0.0

flutter_native_splash:
  color: "#FFA726"
  image: "assets/logo.png"
  android: true
  ios: true

flutter_icons:
  image_path: "assets/logo.png"
  ios: true
  remove_alpha_ios: true
  android: "ic_launcher"
  adaptive_icon_background: "#FFA726"
  adaptive_icon_foreground: "assets/logo.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.7
  mobx_codegen: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/img_error.png
    - assets/img_capa.jpg
    # images
    - assets/logo_principal.png
    
    # icons
    - assets/icons/google_logo.png
    # papeis
    - assets/paper/
    
    # layout